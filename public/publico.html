<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rifa — Números disponibles</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #111; padding: 1rem; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .subtitulo { font-size: 13px; color: #666; margin-bottom: 1rem; }
    .stats { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
    .stat { padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; }
    .stat-libre { background: #d1fae5; color: #065f46; }
    .stat-vendido { background: #fee2e2; color: #991b1b; }
    .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
    @media (max-width: 420px) { .grid { grid-template-columns: repeat(5, 1fr); gap: 6px; } }
    @media (min-width: 421px) and (max-width: 560px) { .grid { grid-template-columns: repeat(8, 1fr); } }
    .num {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      border-radius: 8px; border: 1.5px solid #d1d5db; background: white;
      font-size: 13px; font-weight: 600;
    }
    .num.vendido { background: #fee2e2; border-color: #fca5a5; color: #991b1b; }
    .leyenda { display: flex; gap: 16px; margin-top: 12px; font-size: 12px; color: #666; }
    .leyenda span { display: flex; align-items: center; gap: 6px; }
    .dot { width: 12px; height: 12px; border-radius: 3px; }
    .dot-libre { background: white; border: 1.5px solid #d1d5db; }
    .dot-vendido { background: #fee2e2; border: 1.5px solid #fca5a5; }
    .sync { font-size: 11px; color: #9ca3af; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

<h1>🎟 Rifa — Números disponibles</h1>
<p class="subtitulo">Para reservar un número contactá al organizador</p>

<div class="stats">
  <span class="stat stat-libre">Libres: <b id="cnt-libre">100</b></span>
  <span class="stat stat-vendido">Vendidos: <b id="cnt-vendido">0</b></span>
</div>

<div class="grid" id="grid"></div>

<div class="leyenda">
  <span><div class="dot dot-libre"></div> Disponible</span>
  <span><div class="dot dot-vendido"></div> Vendido</span>
</div>

<div class="sync" id="sync">Cargando...</div>

<script>
  async function cargar() {
    try {
      const r = await fetch('/api/numeros');
      const datos = await r.json();
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      let libres = 0, vendidos = 0;
      for (let i = 1; i <= 250; i++) {
        const div = document.createElement('div');
        div.className = 'num' + (datos[i] ? ' vendido' : '');
        div.textContent = i;
        grid.appendChild(div);
        datos[i] ? vendidos++ : libres++;
      }
      document.getElementById('cnt-libre').textContent = libres;
      document.getElementById('cnt-vendido').textContent = vendidos;
      document.getElementById('sync').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-CL');
    } catch(e) {
      document.getElementById('sync').textContent = 'Error de conexión, reintentando...';
    }
  }

  cargar();
  setInterval(cargar, 15000);
</script>
</body>
</html>
